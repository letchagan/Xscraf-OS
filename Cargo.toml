[package]
name = "aether_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
# bootloader is used by `cargo bootimage` to create the bootable disk image.
# It is not linked into the kernel binary itself.
bootloader = { version = "0.9.35", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.9.8"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
x86_64 = { version = "0.14.12", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
uart_16550 = "0.3.2"
pic8259 = "0.10.4"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10.4"

[features]
default = ["alloc"]
alloc = []